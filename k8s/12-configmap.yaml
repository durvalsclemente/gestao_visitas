apiVersion: v1
kind: ConfigMap
metadata:
  name: visitas-config
  namespace: visitas
data:
  NODE_ENV: "production"
  PORT: "3001"

  # Central — endpoints públicos
  CENTRAL_JWKS_URI: "https://api.auth.osc.app.br/.well-known/jwks.json"
  CENTRAL_ISSUER:   "https://api.auth.osc.app.br"
  CENTRAL_AUDIENCE: "gestao-visitas"
  CENTRAL_URL:      "https://auth.osc.app.br"
  # Compat com o env.validation legacy (que ainda exige esses claims)
  # HS256 só para satisfazer env.validation (legacy). O validador real usa CENTRAL_JWKS_URI.
  CENTRAL_JWT_ALG:      "HS256"
  CENTRAL_JWT_ISSUER:   "https://api.auth.osc.app.br"
  CENTRAL_JWT_AUDIENCE: "gestao-visitas"
  # Webhook receiver auth (ainda inbound do Central legacy — header API_KEY)
  CENTRAL_WEBHOOK_AUTH_TYPE:   "API_KEY"
  CENTRAL_WEBHOOK_AUTH_HEADER: "X-OSC-Signature"

  CORS_ORIGIN: "https://visitas.osc.app.br,https://auth.osc.app.br"
